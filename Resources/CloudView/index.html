<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="A public, read-only live view of CodeWindow agent activity.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a84ff'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-size='28' font-family='Arial' fill='white'%3Ecw%3C/text%3E%3C/svg%3E">
  <title>CodeWindow Cloud View</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #030304;
      --shell: #09090b;
      --sidebar: #070708;
      --detail: #0b0b0d;
      --raised: #111114;
      --selected: #19191d;
      --selected-border: rgba(255, 255, 255, 0.09);
      --hover: #121215;
      --text: rgba(255, 255, 255, 0.95);
      --secondary: rgba(255, 255, 255, 0.56);
      --tertiary: rgba(255, 255, 255, 0.50);
      --line: rgba(255, 255, 255, 0.075);
      --working: #30d158;
      --starting: #0a84ff;
      --attention: #ff9f0a;
      --idle: rgba(255, 255, 255, 0.30);
      --radius: 26px;
      --row-radius: 15px;
      --sidebar-width: 310px;
      --header-height: 64px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
      font-weight: 400;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--page);
      color: var(--text);
    }

    body {
      min-height: 100svh;
      padding: clamp(16px, 3.2vw, 42px);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    button {
      color: inherit;
      font: inherit;
    }

    button:focus-visible {
      outline: 2px solid rgba(10, 132, 255, 0.92);
      outline-offset: -2px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    .app-shell {
      width: min(1120px, 100%);
      height: min(760px, calc(100svh - clamp(32px, 6.4vw, 84px)));
      min-height: 580px;
      display: grid;
      grid-template-rows: var(--header-height) minmax(0, 1fr);
      overflow: hidden;
      background: var(--shell);
      border: 1px solid rgba(255, 255, 255, 0.085);
      border-radius: var(--radius);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.55);
    }

    .app-header {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 17px 0 20px;
      background: #08080a;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 9px;
      background: #efefef;
      color: #050506;
      font-size: 13px;
      letter-spacing: -0.04em;
    }

    .brand-copy {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 7px;
      white-space: nowrap;
    }

    .brand-name {
      font-size: 14px;
      letter-spacing: -0.01em;
    }

    .brand-mode {
      color: var(--tertiary);
      font-size: 11px;
    }

    .connection-pill {
      min-width: 0;
      min-height: 34px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.075);
      border-radius: 999px;
      background: #111113;
      color: var(--secondary);
      font-size: 11px;
      white-space: nowrap;
    }

    .connection-pill[data-state="offline"] {
      color: rgba(255, 255, 255, 0.48);
    }

    .connection-dot,
    .status-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--idle);
    }

    .connection-pill[data-state="live"] .connection-dot {
      background: var(--working);
    }

    .connection-pill[data-state="reconnecting"] .connection-dot {
      background: var(--starting);
    }

    .connection-divider {
      width: 1px;
      height: 12px;
      background: var(--line);
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
    }

    .sidebar {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
    }

    .sidebar-header {
      min-height: 61px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px 0 20px;
      border-bottom: 1px solid var(--line);
    }

    .sidebar-title {
      color: rgba(255, 255, 255, 0.84);
      font-size: 13px;
    }

    .session-count {
      min-width: 25px;
      height: 21px;
      display: grid;
      place-items: center;
      padding: 0 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.075);
      color: var(--secondary);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .session-list {
      min-height: 0;
      margin: 0;
      padding: 9px;
      overflow: auto;
      list-style: none;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
    }

    .session-item + .session-item {
      margin-top: 3px;
    }

    .session-button {
      width: 100%;
      min-height: 88px;
      display: grid;
      grid-template-columns: 31px minmax(0, 1fr) auto;
      column-gap: 11px;
      align-items: start;
      padding: 12px 11px;
      appearance: none;
      border: 1px solid transparent;
      border-radius: var(--row-radius);
      background: transparent;
      text-align: left;
      cursor: default;
      transition: background-color 150ms ease, border-color 150ms ease;
    }

    .session-button:hover {
      background: var(--hover);
    }

    .session-button[aria-current="true"] {
      background: var(--selected);
      border-color: var(--selected-border);
    }

    .agent-mark {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      color: rgba(255, 255, 255, 0.92);
    }

    .agent-mark svg {
      display: block;
    }

    .agent-mark[data-agent="codex"] svg {
      width: 16px;
      height: 16px;
    }

    .agent-mark[data-agent="claude"] svg {
      width: 14px;
      height: 14px;
    }

    .agent-mark[data-agent="pi"] svg {
      width: 22px;
      height: 22px;
    }

    .session-copy {
      min-width: 0;
      display: block;
    }

    .session-meta {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .session-project {
      min-width: 0;
      overflow: hidden;
      color: var(--secondary);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .session-preview {
      min-width: 0;
      display: block;
      overflow: hidden;
      color: rgba(255, 255, 255, 0.96);
      font-size: 12.5px;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .session-meta {
      margin-top: 5px;
      color: rgba(255, 255, 255, 0.48);
      font-size: 10px;
    }

    .session-action {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .session-age {
      padding-top: 1px;
      color: var(--tertiary);
      font-size: 9px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .session-button[data-activity="working"] .status-dot {
      background: var(--working);
    }

    .session-button[data-activity="starting"] .status-dot {
      background: var(--starting);
    }

    .session-button[data-activity="needsAttention"] .status-dot {
      background: var(--attention);
    }

    .session-button[data-activity="needsAttention"] .session-preview {
      color: var(--attention);
    }

    .detail {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--detail);
    }

    .detail-header {
      min-height: 61px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
    }

    .mobile-back {
      display: none;
      width: 34px;
      height: 34px;
      place-items: center;
      appearance: none;
      border: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.065);
      color: var(--text);
      font-size: 19px;
    }

    .detail-identity {
      min-width: 0;
      flex: 1;
    }

    .detail-project {
      overflow: hidden;
      color: rgba(255, 255, 255, 0.91);
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail-agent-state {
      margin-top: 3px;
      color: var(--tertiary);
      font-size: 10px;
    }

    .detail-status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--secondary);
      font-size: 10px;
      white-space: nowrap;
    }

    .detail-status[data-activity="working"] .status-dot {
      background: var(--working);
    }

    .detail-status[data-activity="starting"] .status-dot {
      background: var(--starting);
    }

    .detail-status[data-activity="needsAttention"] .status-dot {
      background: var(--attention);
    }

    .detail-scroll {
      min-height: 0;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
    }

    .detail-content {
      width: min(690px, 100%);
      min-height: 100%;
      margin: 0 auto;
      padding: 34px clamp(24px, 4vw, 48px) 52px;
    }

    .section-label {
      color: var(--tertiary);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .task-preview {
      max-width: 620px;
      margin: 11px 0 0;
      color: rgba(255, 255, 255, 0.96);
      font-size: clamp(20px, 2.6vw, 27px);
      line-height: 1.22;
      letter-spacing: -0.026em;
      text-wrap: balance;
    }

    .action-block {
      margin-top: 25px;
      padding: 13px 15px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--raised);
    }

    .action-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--secondary);
      font-size: 10px;
    }

    .action-value {
      margin-top: 8px;
      overflow-wrap: anywhere;
      color: rgba(255, 255, 255, 0.88);
      font-family: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.55;
    }

    .feed-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 34px;
      padding-bottom: 13px;
      border-bottom: 1px solid var(--line);
    }

    .feed-count {
      color: var(--tertiary);
      font-size: 9px;
      font-variant-numeric: tabular-nums;
    }

    .feed-list {
      margin: 0;
      padding: 7px 0 0;
      list-style: none;
    }

    .feed-event {
      position: relative;
      display: grid;
      grid-template-columns: 25px minmax(0, 1fr);
      column-gap: 13px;
      padding: 15px 0;
    }

    .feed-event:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 12px;
      top: 40px;
      bottom: -4px;
      width: 1px;
      background: var(--line);
    }

    .event-glyph {
      position: relative;
      z-index: 1;
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.085);
      border-radius: 9px;
      background: #111114;
      color: var(--secondary);
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: 10px;
    }

    .feed-event[data-kind="toolResult"][data-succeeded="true"] .event-glyph {
      color: var(--working);
    }

    .feed-event[data-kind="toolResult"][data-succeeded="false"] .event-glyph,
    .feed-event[data-kind="attention"] .event-glyph {
      color: var(--attention);
    }

    .feed-event[data-kind="user"] .event-glyph {
      color: var(--starting);
    }

    .event-copy {
      min-width: 0;
      padding-top: 1px;
    }

    .event-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .event-label {
      color: var(--secondary);
      font-size: 10px;
    }

    .event-age {
      color: var(--tertiary);
      font-size: 9px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .event-text {
      margin-top: 5px;
      overflow-wrap: anywhere;
      color: rgba(255, 255, 255, 0.88);
      font-size: 12px;
      line-height: 1.5;
    }

    .event-detail {
      margin-top: 6px;
      overflow-wrap: anywhere;
      color: var(--secondary);
      font-size: 11px;
      line-height: 1.5;
    }

    .feed-event[data-kind="toolCall"] .event-detail,
    .feed-event[data-kind="toolResult"] .event-detail {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
      font-size: 10.5px;
    }

    .empty-state,
    .loading-state {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 36px;
      text-align: center;
    }

    .empty-copy {
      max-width: 330px;
    }

    .empty-icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--tertiary);
      font-size: 15px;
    }

    .empty-title {
      color: rgba(255, 255, 255, 0.82);
      font-size: 13px;
    }

    .empty-message {
      margin-top: 7px;
      color: var(--tertiary);
      font-size: 11px;
      line-height: 1.5;
    }

    .stale .detail,
    .stale .session-list {
      opacity: 0.68;
    }

    .detail-swap {
      animation: detail-swap 180ms ease-out;
    }

    @keyframes detail-swap {
      from { opacity: 0.35; transform: translateY(2px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 719px) {
      body {
        display: block;
        padding: 0;
        overflow: hidden;
      }

      .app-shell {
        width: 100%;
        height: 100svh;
        min-height: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .app-header {
        min-height: calc(var(--header-height) + env(safe-area-inset-top));
        padding-top: env(safe-area-inset-top);
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(14px, env(safe-area-inset-right));
      }

      .brand-mode,
      .connection-divider,
      .connection-age {
        display: none;
      }

      .workspace {
        position: relative;
        display: block;
        overflow: hidden;
      }

      .sidebar,
      .detail {
        position: absolute;
        inset: 0;
        width: 100%;
        border: 0;
        transition: transform 210ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 170ms ease;
      }

      .sidebar {
        transform: translateX(0);
        opacity: 1;
      }

      .detail {
        transform: translateX(5%);
        opacity: 0;
        pointer-events: none;
      }

      .app-shell[data-mobile-view="detail"] .sidebar {
        transform: translateX(-5%);
        opacity: 0;
        pointer-events: none;
      }

      .app-shell[data-mobile-view="detail"] .detail {
        transform: translateX(0);
        opacity: 1;
        pointer-events: auto;
      }

      .sidebar-header,
      .detail-header {
        min-height: 58px;
      }

      .mobile-back {
        display: grid;
      }

      .detail-header {
        padding: 0 14px;
      }

      .detail-content {
        padding: 27px 20px calc(42px + env(safe-area-inset-bottom));
      }

      .task-preview {
        font-size: 22px;
      }

      .session-button {
        min-height: 92px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell" id="app" data-mobile-view="list">
    <header class="app-header">
      <div class="brand" aria-label="CodeWindow Cloud View">
        <span class="brand-mark" aria-hidden="true">cw</span>
        <span class="brand-copy">
          <span class="brand-name">CodeWindow</span>
          <span class="brand-mode">Cloud View</span>
        </span>
      </div>
      <div class="connection-pill" id="connection" data-state="reconnecting">
        <span class="connection-dot" aria-hidden="true"></span>
        <span id="connection-label" role="status" aria-live="polite" aria-atomic="true">Connecting</span>
        <span class="connection-divider" aria-hidden="true"></span>
        <span class="connection-age" id="connection-age" aria-hidden="true">waiting for Mac</span>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar" aria-label="Agent sessions">
        <div class="sidebar-header">
          <span class="sidebar-title">Sessions</span>
          <span class="session-count" id="session-count">0</span>
        </div>
        <ul class="session-list" id="session-list"></ul>
      </aside>

      <section class="detail" id="detail" aria-label="Selected session">
        <div class="loading-state">
          <div class="empty-copy">
            <div class="empty-icon" aria-hidden="true">···</div>
            <div class="empty-title">Connecting to your Mac</div>
            <div class="empty-message">The latest CodeWindow activity will appear here.</div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const app = document.getElementById("app");
      const sidebar = document.querySelector(".sidebar");
      const sessionList = document.getElementById("session-list");
      const sessionCount = document.getElementById("session-count");
      const detail = document.getElementById("detail");
      const connection = document.getElementById("connection");
      const connectionLabel = document.getElementById("connection-label");
      const connectionAge = document.getElementById("connection-age");
      const previewMode = ["localhost", "127.0.0.1"].includes(location.hostname)
        && new URLSearchParams(location.search).has("preview");
      const endpoint = previewMode ? "preview-state.json" : "state.json";

      let snapshot = null;
      let viewerIssue = null;
      let selectedID = null;
      let fetchInFlight = false;

      const activityLabels = {
        starting: "starting",
        working: "working",
        needsAttention: "needs attention",
        idle: "idle",
        ended: "ended"
      };

      const actionLabels = {
        waiting: "waiting",
        thinking: "thinking",
        runningCommand: "running command",
        editingFile: "editing file",
        readingFile: "reading file",
        searching: "searching",
        usingTool: "using tool",
        awaitingPermission: "needs permission",
        failed: "action failed"
      };

      const eventPresentation = {
        user: { label: "YOU", glyph: "↑" },
        assistant: { label: "ASSISTANT", glyph: "✦" },
        toolCall: { label: "TOOL", glyph: "›" },
        toolResult: { label: "DONE", glyph: "✓" },
        attention: { label: "ATTENTION", glyph: "!" }
      };

      const agentArtwork = {
        codex: {
          viewBox: "0 0 24 24",
          fill: "#fff",
          paths: [
            "M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.855l-5.833-3.387L15.119 7.2a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.407-.667zm2.01-3.023l-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zm-12.64 4.135l-2.02-1.164a.08.08 0 0 1-.038-.057V6.075a4.5 4.5 0 0 1 7.375-3.453l-.142.08L8.704 5.46a.795.795 0 0 0-.393.681zm1.097-2.365l2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5z"
          ]
        },
        claude: {
          viewBox: "0 0 24 24",
          fill: "#D97757",
          paths: [
            "M4.709 15.955l4.72-2.647.08-.23-.08-.128H9.2l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.449.255h.389l.055-.157-.134-.098-.103-.097-2.358-1.596-2.552-1.688-1.336-.972-.724-.491-.364-.462-.158-1.008.656-.722.881.06.225.061.893.686 1.908 1.476 2.491 1.833.365.304.145-.103.019-.073-.164-.274-1.355-2.446-1.446-2.49-.644-1.032-.17-.619a2.97 2.97 0 01-.104-.729L6.283.134 6.696 0l.996.134.42.364.62 1.414 1.002 2.229 1.555 3.03.456.898.243.832.091.255h.158V9.01l.128-1.706.237-2.095.23-2.695.08-.76.376-.91.747-.492.584.28.48.685-.067.444-.286 1.851-.559 2.903-.364 1.942h.212l.243-.242.985-1.306 1.652-2.064.73-.82.85-.904.547-.431h1.033l.76 1.129-.34 1.166-1.064 1.347-.881 1.142-1.264 1.7-.79 1.36.073.11.188-.02 2.856-.606 1.543-.28 1.841-.315.833.388.091.395-.328.807-1.969.486-2.309.462-3.439.813-.042.03.049.061 1.549.146.662.036h1.622l3.02.225.79.522.474.638-.079.485-1.215.62-1.64-.389-3.829-.91-1.312-.329h-.182v.11l1.093 1.068 2.006 1.81 2.509 2.33.127.578-.322.455-.34-.049-2.205-1.657-.851-.747-1.926-1.62h-.128v.17l.444.649 2.345 3.521.122 1.08-.17.353-.608.213-.668-.122-1.374-1.925-1.415-2.167-1.143-1.943-.14.08-.674 7.254-.316.37-.729.28-.607-.461-.322-.747.322-1.476.389-1.924.315-1.53.286-1.9.17-.632-.012-.042-.14.018-1.434 1.967-2.18 2.945-1.726 1.845-.414.164-.717-.37.067-.662.401-.589 2.388-3.036 1.44-1.882.93-1.086-.006-.158h-.055L4.132 18.56l-1.13.146-.487-.456.061-.746.231-.243 1.908-1.312-.006.006z"
          ]
        },
        pi: {
          viewBox: "0 0 800 800",
          fill: "#fff",
          paths: [
            "M165.29 165.29H517.36V400H400V517.36H282.65V634.72H165.29ZM282.65 282.65V400H400V282.65Z",
            "M517.36 400H634.72V634.72H517.36Z"
          ]
        }
      };

      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = String(text);
        return node;
      }

      function setText(node, value) {
        if (node.textContent !== value) node.textContent = value;
      }

      function agentMark(agent) {
        const artwork = agentArtwork[agent] || agentArtwork.codex;
        const mark = element("span", "agent-mark");
        mark.dataset.agent = agent;
        mark.setAttribute("aria-hidden", "true");
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", artwork.viewBox);
        for (const pathData of artwork.paths) {
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", pathData);
          path.setAttribute("fill", artwork.fill);
          svg.append(path);
        }
        mark.append(svg);
        return mark;
      }

      function parseDate(value) {
        const date = new Date(value);
        return Number.isFinite(date.getTime()) ? date : null;
      }

      function relativeAge(value, now = Date.now()) {
        const date = parseDate(value);
        if (!date) return "unknown";
        const seconds = Math.max(0, Math.floor((now - date.getTime()) / 1000));
        if (seconds < 5) return "now";
        if (seconds < 60) return `${seconds}s`;
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes}m`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours}h`;
        return `${Math.floor(hours / 24)}d`;
      }

      function actionLabel(action) {
        return actionLabels[action] || "working";
      }

      function agentLabel(agent) {
        if (agent === "claude") return "Claude";
        if (agent === "pi") return "Pi";
        return "Codex";
      }

      function snapshotIssue(candidate) {
        if (!candidate || typeof candidate !== "object") return "malformed";
        if (candidate.schemaVersion !== 1) return "unsupported";
        if (!Number.isSafeInteger(candidate.revision)
          || candidate.revision < 0
          || typeof candidate.generatedAt !== "string"
          || !parseDate(candidate.generatedAt)
          || !Array.isArray(candidate.sessions)) return "malformed";

        const agents = new Set(["codex", "claude", "pi"]);
        const activities = new Set(["starting", "working", "needsAttention", "idle", "ended"]);
        const actions = new Set([
          "waiting", "thinking", "runningCommand", "editingFile", "readingFile",
          "searching", "usingTool", "awaitingPermission", "failed"
        ]);
        const eventKinds = new Set(["user", "assistant", "toolCall", "toolResult", "attention"]);
        const optionalString = (value) => value === null || value === undefined || typeof value === "string";
        const sessionIDs = new Set();

        for (const session of candidate.sessions) {
          if (!session || typeof session !== "object"
            || typeof session.id !== "string" || !session.id
            || sessionIDs.has(session.id)
            || !agents.has(session.agent)
            || !activities.has(session.activity)
            || typeof session.projectLabel !== "string"
            || !actions.has(session.action)
            || !optionalString(session.taskPreview)
            || !optionalString(session.actionPreview)
            || typeof session.updatedAt !== "string"
            || !parseDate(session.updatedAt)
            || !Array.isArray(session.events)
            || session.events.length > 40) return "malformed";
          sessionIDs.add(session.id);

          const eventIDs = new Set();
          for (const event of session.events) {
            if (!event || typeof event !== "object"
              || typeof event.id !== "string" || !event.id
              || eventIDs.has(event.id)
              || !eventKinds.has(event.kind)
              || typeof event.text !== "string"
              || !optionalString(event.detail)
              || !(event.succeeded === null || event.succeeded === undefined || typeof event.succeeded === "boolean")
              || !(event.createdAt === null || event.createdAt === undefined
                || (typeof event.createdAt === "string" && parseDate(event.createdAt)))) return "malformed";
            eventIDs.add(event.id);
          }
        }
        return null;
      }

      function normalizePreview(candidate) {
        if (!previewMode) return candidate;
        const sourceTime = parseDate(candidate.generatedAt)?.getTime() || Date.now();
        const shift = Date.now() - sourceTime;
        return {
          ...candidate,
          generatedAt: new Date(sourceTime + shift).toISOString(),
          sessions: candidate.sessions.map((session) => ({
            ...session,
            updatedAt: new Date((parseDate(session.updatedAt)?.getTime() || sourceTime) + shift).toISOString(),
            events: (session.events || []).map((event) => ({
              ...event,
              createdAt: new Date((parseDate(event.createdAt)?.getTime() || sourceTime) + shift).toISOString()
            }))
          }))
        };
      }

      function setMobileView(view) {
        app.dataset.mobileView = view;
        const isMobile = window.matchMedia("(max-width: 719px)").matches;
        const hidesSidebar = isMobile && view === "detail";
        const hidesDetail = isMobile && view === "list";
        sidebar.toggleAttribute("inert", hidesSidebar);
        detail.toggleAttribute("inert", hidesDetail);
        if (isMobile) {
          sidebar.setAttribute("aria-hidden", String(hidesSidebar));
          detail.setAttribute("aria-hidden", String(hidesDetail));
        } else {
          sidebar.removeAttribute("aria-hidden");
          detail.removeAttribute("aria-hidden");
        }
      }

      function selectSession(id, pushHistory) {
        if (!snapshot?.sessions.some((session) => session.id === id)) return;
        selectedID = id;
        if (window.matchMedia("(max-width: 719px)").matches) {
          setMobileView("detail");
          if (pushHistory) history.pushState({ session: id }, "");
        }
        render(false);
        if (window.matchMedia("(max-width: 719px)").matches) {
          detail.querySelector(".mobile-back")?.focus();
        }
      }

      function showSessionList() {
        setMobileView("list");
        if (history.state?.session) history.back();
        window.requestAnimationFrame(() => {
          sessionList.querySelector('[aria-current="true"]')?.focus();
        });
      }

      function makeSessionRow(session) {
        const item = element("li", "session-item");
        item.dataset.sessionId = session.id;
        const button = element("button", "session-button");
        button.type = "button";
        button.dataset.activity = session.activity;
        button.setAttribute("aria-current", String(session.id === selectedID));
        const preview = session.actionPreview || session.taskPreview || actionLabel(session.action);
        const age = relativeAge(session.updatedAt);
        button.addEventListener("click", () => selectSession(session.id, true));

        const copy = element("span", "session-copy");
        const meta = element("span", "session-meta");
        meta.append(
          element("span", "status-dot"),
          element("span", "session-action", actionLabel(session.action)),
          element("span", "", "·"),
          element("span", "session-project", session.projectLabel)
        );
        copy.append(element("span", "session-preview", preview), meta);
        button.append(
          agentMark(session.agent),
          copy,
          element("span", "session-age", age),
          element(
            "span",
            "visually-hidden",
            `${agentLabel(session.agent)}, ${activityLabels[session.activity] || session.activity}`
          )
        );
        item.append(button);
        return item;
      }

      function makeDetailHeader(session) {
        const header = element("div", "detail-header");
        const back = element("button", "mobile-back", "‹");
        back.type = "button";
        back.setAttribute("aria-label", "Back to sessions");
        back.addEventListener("click", showSessionList);

        const identity = element("div", "detail-identity");
        identity.append(
          element("div", "detail-project", session.projectLabel),
          element("div", "detail-agent-state", `${agentLabel(session.agent)} · ${activityLabels[session.activity] || session.activity}`)
        );

        const status = element("div", "detail-status");
        status.dataset.activity = session.activity;
        status.append(
          element("span", "status-dot"),
          element("span", "", activityLabels[session.activity] || session.activity)
        );
        header.append(back, agentMark(session.agent), identity, status);
        return header;
      }

      function makeFeedEvent(event) {
        const presentation = eventPresentation[event.kind] || { label: "Update", glyph: "·" };
        const item = element("li", "feed-event");
        item.dataset.kind = event.kind;
        if (event.succeeded !== null && event.succeeded !== undefined) {
          item.dataset.succeeded = String(event.succeeded);
        }

        const glyph = element("span", "event-glyph", presentation.glyph);
        glyph.setAttribute("aria-hidden", "true");
        const copy = element("div", "event-copy");
        const header = element("div", "event-header");
        const label = event.kind === "toolResult" && event.succeeded === false ? "FAILED" : presentation.label;
        header.append(element("span", "event-label", label));
        if (event.createdAt) {
          header.append(element("span", "event-age", relativeAge(event.createdAt)));
        }
        copy.append(header, element("div", "event-text", event.text));
        if (event.detail) copy.append(element("div", "event-detail", event.detail));
        item.append(glyph, copy);
        return item;
      }

      function renderEmptyDetail() {
        const state = element("div", "empty-state");
        const copy = element("div", "empty-copy");
        copy.append(
          element("div", "empty-icon", "○"),
          element("div", "empty-title", "No agents running"),
          element("div", "empty-message", "CodeWindow is connected and waiting for Codex, Claude, or Pi.")
        );
        state.append(copy);
        detail.replaceChildren(state);
      }

      function renderInitialProblem(issue) {
        setMobileView("detail");
        selectedID = null;
        sessionCount.textContent = "0";
        sessionList.replaceChildren();
        const state = element("div", "empty-state");
        const copy = element("div", "empty-copy");
        const unsupported = issue === "unsupported";
        copy.append(
          element("div", "empty-icon", unsupported ? "↻" : "···"),
          element("div", "empty-title", unsupported ? "Viewer update required" : "Waiting for a valid update"),
          element(
            "div",
            "empty-message",
            unsupported
              ? "Update CodeWindow on your Mac to read this Cloud View."
              : "CodeWindow will retry without displaying the incomplete state."
          )
        );
        state.append(copy);
        detail.replaceChildren(state);
      }

      function renderDetail(session) {
        const previousScroll = detail.querySelector(".detail-scroll");
        const sameSession = detail.dataset.sessionId === session.id;
        const previousTop = sameSession ? previousScroll?.scrollTop || 0 : 0;
        const followedLatest = sameSession && previousScroll
          ? previousScroll.scrollHeight - previousScroll.clientHeight - previousScroll.scrollTop < 36
          : false;
        const scroll = element("div", "detail-scroll detail-swap");
        const content = element("div", "detail-content");
        content.append(element("div", "section-label", "Current task"));
        content.append(element("h1", "task-preview", session.taskPreview || session.actionPreview || actionLabel(session.action)));

        const action = element("section", "action-block");
        const actionHeading = element("div", "action-heading");
        actionHeading.append(
          element("span", "", actionLabel(session.action)),
          element("span", "", relativeAge(session.updatedAt))
        );
        action.append(actionHeading);
        if (session.actionPreview) action.append(element("div", "action-value", session.actionPreview));
        content.append(action);

        const events = Array.isArray(session.events) ? session.events : [];
        const feedHeading = element("div", "feed-heading");
        feedHeading.append(
          element("span", "section-label", "Live activity"),
          element("span", "feed-count", `${events.length} ${events.length === 1 ? "event" : "events"}`)
        );
        content.append(feedHeading);

        if (events.length) {
          const feed = element("ol", "feed-list");
          for (const event of events) feed.append(makeFeedEvent(event));
          content.append(feed);
        } else {
          const empty = element("div", "empty-message", "Waiting for the next session update.");
          empty.style.padding = "24px 0";
          content.append(empty);
        }
        scroll.append(content);
        detail.replaceChildren(makeDetailHeader(session), scroll);
        detail.dataset.sessionId = session.id;
        if (sameSession) {
          window.requestAnimationFrame(() => {
            scroll.scrollTop = followedLatest ? scroll.scrollHeight : previousTop;
          });
        }
      }

      function updateConnection() {
        if (!snapshot) {
          const paused = viewerIssue !== null;
          connection.dataset.state = paused ? "offline" : "reconnecting";
          setText(connectionLabel, paused ? "Viewer paused" : "Connecting");
          setText(connectionAge, "waiting for Mac");
          app.classList.remove("stale");
          return;
        }

        const generated = parseDate(snapshot.generatedAt)?.getTime() || 0;
        const stale = Date.now() - generated > 90000;
        connection.dataset.state = stale ? "offline" : "live";
        setText(connectionLabel, stale ? "Mac offline" : "Mac live");
        setText(connectionAge, stale ? `last seen ${relativeAge(snapshot.generatedAt)}` : `updated ${relativeAge(snapshot.generatedAt)}`);
        app.classList.toggle("stale", stale);
      }

      function focusedControl() {
        const active = document.activeElement;
        const sessionID = active?.closest?.(".session-item")?.dataset.sessionId;
        if (sessionID) return { kind: "session", sessionID };
        if (active?.classList?.contains("mobile-back")) return { kind: "back" };
        return null;
      }

      function restoreFocusedControl(control) {
        if (!control) return;
        if (control.kind === "session") {
          sessionList.querySelector(`[data-session-id="${CSS.escape(control.sessionID)}"] .session-button`)
            ?.focus({ preventScroll: true });
        } else if (control.kind === "back") {
          detail.querySelector(".mobile-back")?.focus({ preventScroll: true });
        }
      }

      function render(preserveFocus = true) {
        const focused = preserveFocus ? focusedControl() : null;
        updateConnection();
        const sessions = snapshot?.sessions || [];
        sessionCount.textContent = String(sessions.length);
        if (!sessions.length && window.matchMedia("(max-width: 719px)").matches) {
          setMobileView("detail");
        }

        if (selectedID && !sessions.some((session) => session.id === selectedID)) selectedID = null;
        if (!selectedID && sessions.length) selectedID = sessions[0].id;

        sessionList.replaceChildren(...sessions.map(makeSessionRow));
        const selected = sessions.find((session) => session.id === selectedID);
        if (selected) renderDetail(selected);
        else renderEmptyDetail();
        restoreFocusedControl(focused);
      }

      async function refresh() {
        if (fetchInFlight) return;
        fetchInFlight = true;
        const controller = new AbortController();
        const requestTimeout = window.setTimeout(() => controller.abort(), 8000);
        try {
          const response = await fetch(`${endpoint}?t=${Date.now()}`, {
            cache: "no-store",
            signal: controller.signal
          });
          if (!response.ok) throw new Error(`state request failed (${response.status})`);
          let decoded;
          try {
            decoded = await response.json();
          } catch {
            const error = new Error("malformed snapshot");
            error.viewerIssue = "malformed";
            throw error;
          }
          const issue = snapshotIssue(decoded);
          if (issue) {
            const error = new Error(`${issue} snapshot`);
            error.viewerIssue = issue;
            throw error;
          }
          const candidate = normalizePreview(decoded);
          viewerIssue = null;
          if (!snapshot || candidate.revision > snapshot.revision) {
            const isFirstSnapshot = !snapshot;
            snapshot = candidate;
            if (isFirstSnapshot) setMobileView("list");
            render();
          } else if (candidate.revision === snapshot.revision) {
            snapshot.generatedAt = candidate.generatedAt;
            updateConnection();
          }
        } catch (error) {
          if (error.viewerIssue === "unsupported") {
            const issueChanged = viewerIssue !== "unsupported";
            snapshot = null;
            viewerIssue = "unsupported";
            connection.dataset.state = "offline";
            setText(connectionLabel, "Viewer paused");
            setText(connectionAge, "waiting for Mac");
            if (issueChanged) renderInitialProblem("unsupported");
          } else if (!snapshot) {
            if (error.viewerIssue) {
              const issueChanged = viewerIssue !== error.viewerIssue;
              viewerIssue = error.viewerIssue;
              connection.dataset.state = "offline";
              setText(connectionLabel, "Viewer paused");
              setText(connectionAge, "waiting for Mac");
              if (issueChanged) renderInitialProblem(error.viewerIssue);
            } else if (!viewerIssue) {
              connection.dataset.state = "reconnecting";
              setText(connectionLabel, "Reconnecting");
              setText(connectionAge, "waiting for state");
            }
          }
        } finally {
          window.clearTimeout(requestTimeout);
          fetchInFlight = false;
        }
      }

      function scheduleRefresh() {
        refresh();
        const delay = document.visibilityState === "visible" ? 1000 : 5000;
        window.setTimeout(scheduleRefresh, delay);
      }

      window.addEventListener("popstate", () => {
        setMobileView(history.state?.session ? "detail" : "list");
      });

      window.addEventListener("resize", () => setMobileView(app.dataset.mobileView));

      window.addEventListener("keydown", (event) => {
        if (!snapshot?.sessions.length || !["ArrowDown", "ArrowUp"].includes(event.key)) return;
        const index = Math.max(0, snapshot.sessions.findIndex((session) => session.id === selectedID));
        const delta = event.key === "ArrowDown" ? 1 : -1;
        const next = snapshot.sessions[(index + delta + snapshot.sessions.length) % snapshot.sessions.length];
        selectSession(next.id, false);
        sessionList.querySelector(`[aria-current="true"]`)?.focus();
        event.preventDefault();
      });

      window.setInterval(() => {
        updateConnection();
        for (const node of document.querySelectorAll(".session-age")) {
          const id = node.closest(".session-item")?.dataset.sessionId;
          const session = snapshot?.sessions.find((candidate) => candidate.id === id);
          if (session) node.textContent = relativeAge(session.updatedAt);
        }
      }, 5000);
      setMobileView(app.dataset.mobileView);
      scheduleRefresh();
    })();
  </script>
</body>
</html>
